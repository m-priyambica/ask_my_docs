{% macro ask_form(doc_id) %}  <form class="card" method="post" action="/ask">
    <h2><span class="step-num">2</span> Ask a question</h2>
    <input type="hidden" name="doc_id" value="{{ doc_id }}">
    <div class="row">
      <input type="text" name="question" placeholder="What does this document say about…?"
             autocomplete="off" autofocus required>
      <button type="submit">Ask</button>
    </div>
  </form>
{% endmacro %}
